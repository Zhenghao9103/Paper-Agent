[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent-sandbox-runtime"
version = "0.1.0"
description = "Independent local Docker Python runtime and optional MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["docker==7.2.0", "pydantic==2.13.4"]

[project.optional-dependencies]
mcp = ["mcp[cli]==2.3.0"]
dev = ["pytest==9.0.3", "ruff>=0.6", "build>=1.2"]

[project.scripts]
sandbox-runtime = "sandbox_runtime.cli:main"
sandbox-mcp = "sandbox_runtime.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a live Linux Docker daemon and built execution image",
  "docker_mock: Docker SDK failure/isolation tests using a mock daemon"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
