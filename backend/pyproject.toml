[project]
name = "papermind-backend"
version = "0.1.0"
description = "FastAPI backend for PaperMind Agent"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "arxiv>=2.1.0",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "orjson>=3.10.0",
  "pillow>=10.4.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyMuPDF>=1.24.0",
  "python-pptx>=0.6.23",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1.0",
  "sqlalchemy>=2.0.0",
  "tenacity>=8.5.0",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
