[project]
name = "papermind-backend"
version = "0.1.0"
description = "FastAPI backend for PaperMind Agent"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.2.1",
  "alembic>=1.13.0",
  "arxiv==4.0.0",
  "beautifulsoup4>=4.13.5",
  "chromadb==0.5.23",
  "datasets==3.2.0",
  "fastapi>=0.115.0",
  "FlagEmbedding==1.4.0",
  "httpx>=0.27.0",
  "huggingface-hub==0.36.2",
  "jieba>=0.42.1",
  "lxml==6.1.0",
  "mineru==3.4.4",
  "modelscope==1.39.1",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "openai>=1.40.0",
  "opencv-python==4.11.0.86",
  "orjson>=3.10.0",
  "peft==0.13.2",
  "pillow>=10.4.0",
  "posthog==3.7.5",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyarrow==18.1.0",
  "PyMuPDF>=1.24.0",
  "python-multipart>=0.0.9",
  "sentence-transformers==3.3.1",
  "sse-starlette>=2.1.0",
  "sqlalchemy>=2.0.0",
  "snowballstemmer>=2.2.0",
  "tenacity>=8.5.0",
  "tiktoken>=0.7.0",
  "tokenizers==0.20.3",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
